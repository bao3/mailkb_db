[workspace]
resolver = "2"
members = [
    "crates/mailkb-core",
    "crates/mailkb-sync",
    "crates/mailkb-query",
    "crates/mailkb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
mailkb-core = { path = "crates/mailkb-core" }
mailkb-sync = { path = "crates/mailkb-sync" }
mailkb-query = { path = "crates/mailkb-query" }

rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
rayon = "1.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
encoding_rs = "0.8"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = 3
